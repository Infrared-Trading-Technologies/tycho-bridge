# cbindgen configuration for tycho-ffi
# Generates C header file for FFI bindings

language = "C"
header = """
/* Auto-generated by cbindgen. Do not edit manually. */
/* This file provides C bindings for the Tycho Bridge library. */
#ifndef TYCHO_BRIDGE_H
#define TYCHO_BRIDGE_H

#include <stdarg.h>
#include <stdbool.h>
#include <stdint.h>
#include <stdlib.h>
"""
trailer = """
#endif /* TYCHO_BRIDGE_H */
"""
autogen_warning = "/* Warning: This file was auto-generated by cbindgen. Changes will be lost. */"
tab_width = 4
style = "type"
cpp_compat = false
no_includes = true
include_guard = ""

[defines]

[export]
include = [
    "FfiBridge",
    "FfiBuffer",
    "FfiString",
    "FfiResult",
    "FfiErrorCode",
    "FfiSpotPriceRequest",
    "FfiGetAmountOutRequest",
    "FfiGetFeeRequest",
    "FfiGetLimitsRequest",
    "FfiSwapToPriceRequest",
    "FfiQuerySupplyRequest",
    "FfiGetTokensRequest",
    "FfiGetComponentsRequest",
    "FfiGetStatusRequest",
    "FfiBatchGetAmountOutRequest",
    "FfiRouteHop",
    "FfiSimulateRouteRequest",
]
exclude = []
prefix = ""
item_types = ["enums", "structs", "opaque", "typedefs", "functions", "constants"]
renaming_overrides_prefixing = false

[export.rename]

[export.body]

[export.mangle]

[fn]
rename_args = "None"
args = "auto"
sort_by = "None"

[struct]
rename_fields = "None"
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false

[enum]
rename_variants = "None"
add_sentinel = false
prefix_with_name = false
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
cast_assert_name = "assert"
must_use = ""
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
private_default_tagged_enum_constructor = false
enum_class = true

[const]
allow_static_const = true
allow_constexpr = false

[macro_expansion]
bitflags = false

[parse]
parse_deps = false
include = []
exclude = []
clean = false
extra_bindings = []

[parse.expand]
crates = []
all_features = false
default_features = true
features = []

[documentation]
style = "doxy"
length = "full"
